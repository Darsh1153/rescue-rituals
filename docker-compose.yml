services:
  postgres:
    image: postgres:16-alpine
    container_name: events-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
      POSTGRES_DB: events
    ports:
      - '5432:5432'
    volumes:
      - events_pg_data:/var/lib/postgresql/data

volumes:
  events_pg_data:
